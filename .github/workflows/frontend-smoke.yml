name: Frontend smoke

on:
  push:
    branches:
      - dev-mobr01
      - main
      - master
  pull_request:
    branches:
      - dev-mobr01
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke-local
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend smoke
        run: ./scripts/smoke-local.sh
